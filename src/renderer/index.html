<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none';"
    />
    <title>Waveshift</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="min-h-screen flex flex-col">
    <main class="flex-1 flex flex-col items-center justify-center p-6">

      <!-- IDLE: Drop zone -->
      <section id="idleView" class="view active">
        <div id="dropZone" class="drop-zone">
          <svg class="w-12 h-12 text-slate-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
          </svg>
          <p class="font-medium text-slate-300" data-i18n="idle.dropFile">Drop an audio file</p>
          <p class="text-sm text-slate-500 mt-1" data-i18n="idle.clickToBrowse">or click to browse</p>
        </div>
        <input type="file" id="fileInput" class="hidden" accept="audio/*,.wav,.aiff,.aif,.flac,.mp3,.m4a,.ogg" />
      </section>

      <!-- READY: File selected, ready to convert -->
      <section id="readyView" class="view">
        <div class="w-full max-w-sm space-y-4">
          <div class="bg-surface-raised rounded-xl p-4 space-y-3">
            <div class="flex items-center justify-between gap-3">
              <span class="text-sm text-slate-400" data-i18n="ready.input">Input</span>
              <span id="inputName" class="text-sm font-medium truncate max-w-[200px]">—</span>
            </div>
            <div class="flex items-center justify-between gap-3">
              <span class="text-sm text-slate-400" data-i18n="ready.output">Output</span>
              <span id="outputName" class="text-sm font-mono truncate max-w-[200px]">.m4a</span>
            </div>
          </div>

          <button id="convertBtn" class="btn btn-primary w-full" data-i18n="ready.convert">Convert to M4A</button>

          <div class="flex justify-center gap-4">
            <button id="changeFileBtn" class="link" data-i18n="ready.changeFile">Choose different file</button>
            <button id="changeFolderBtn" class="link" data-i18n="ready.changeFolder">Change output folder</button>
          </div>
        </div>
      </section>

      <!-- CONVERTING: Progress -->
      <section id="convertingView" class="view">
        <div class="w-full max-w-sm space-y-4">
          <p id="convertingFilename" class="text-sm font-medium truncate" data-i18n="converting.title">Converting...</p>

          <div class="relative h-2 bg-slate-700 rounded-full overflow-hidden">
            <div id="progressBar" class="absolute inset-y-0 left-0 bg-indigo-500 transition-all duration-150 rounded-full" style="width: 0%"></div>
          </div>

          <p id="progressText" class="text-xs text-slate-500 text-center">0%</p>

          <button id="cancelBtn" class="btn btn-secondary w-full" data-i18n="converting.cancel">Cancel</button>
        </div>
      </section>

      <!-- DONE: Success -->
      <section id="doneView" class="view">
        <div class="w-full max-w-sm space-y-5">
          <div class="flex flex-col items-center gap-3">
            <div class="w-14 h-14 rounded-full bg-emerald-500/20 flex items-center justify-center">
              <svg class="w-7 h-7 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            </div>
            <p class="font-semibold text-lg" data-i18n="done.title">Done!</p>
            <p id="doneOutputName" class="text-sm text-slate-400 truncate max-w-full">output.m4a</p>
          </div>

          <div class="flex gap-3">
            <button id="revealBtn" class="btn btn-secondary flex-1" data-i18n="done.showInFinder">Show in Finder</button>
            <button id="anotherBtn" class="btn btn-primary flex-1" data-i18n="done.convertAnother">Convert Another</button>
          </div>
        </div>
      </section>

      <!-- ERROR: Something went wrong -->
      <section id="errorView" class="view">
        <div class="w-full max-w-sm space-y-5">
          <div class="flex flex-col items-center gap-3">
            <div class="w-14 h-14 rounded-full bg-red-500/20 flex items-center justify-center">
              <svg class="w-7 h-7 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </div>
            <p class="font-semibold text-lg" data-i18n="error.title">Conversion Failed</p>
            <p id="errorMessage" class="text-sm text-slate-400 text-center" data-i18n="error.generic">Something went wrong.</p>
          </div>

          <div class="flex gap-3">
            <button id="errorLogsBtn" class="btn btn-secondary flex-1" data-i18n="error.viewLogs">View Logs</button>
            <button id="errorRetryBtn" class="btn btn-primary flex-1" data-i18n="error.tryAgain">Try Again</button>
          </div>
        </div>
      </section>

    </main>

    <footer class="p-4 flex items-center justify-center gap-4">
      <button id="notificationToggle" class="text-xs text-slate-500 hover:text-slate-400 transition-colors flex items-center gap-1.5" title="Toggle notifications">
        <svg id="notificationIcon" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <span id="notificationLabel" data-i18n="settings.notificationsOn">Notifications on</span>
      </button>
      <span class="text-slate-700">·</span>
      <button id="logsBtn" class="text-xs text-slate-500 hover:text-slate-400 transition-colors" data-i18n="footer.logs">
        Logs
      </button>
    </footer>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
